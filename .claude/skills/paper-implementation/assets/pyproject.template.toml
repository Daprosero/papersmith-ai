# Isolation marker. Its presence stops pytest, ruff and friends from walking up
# the directory tree and adopting the forge's configuration as their root.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "{{NAME_LOWER}}"
version = "0.1.0"
description = "Implementation of {{REVISION}}"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package straight from src/ — no install step, no network.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
