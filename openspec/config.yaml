strict_tdd: true
context: |
  papersmith-ai is a mixed Python + Node.js repository.
  Detected markers: `requirements.txt`, `tests/`, `.pi/`, `openspec/`, `papersmith.yaml`.
  Test capabilities were verified during init: Node built-in `node:test` suites and a Python `unittest` suite are present.
  Unit tests: Node built-in suites in `tests/*.test.mjs`.
  Integration tests: none explicitly detected.
  E2E tests: none explicitly detected.
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: "node --test tests/*.test.mjs && python3 -m unittest discover -s tests -p 'test_extract_pdf.py'"
  verify:
    test_command: "node --test tests/*.test.mjs && python3 -m unittest discover -s tests -p 'test_extract_pdf.py'"
testing:
  detected: "2026-07-16"
  runner:
    command: "node --test tests/*.test.mjs && python3 -m unittest discover -s tests -p 'test_extract_pdf.py'"
    framework: "node:test + unittest"
  layers:
    unit: ""
    integration: ""
    e2e: ""
  commands:
    unit:
      []
    integration:
      []
    e2e:
      []
  coverage:
    command: ""
    commands:
      []
quality:
  lint: ""
  lint_commands:
    []
  typecheck: ""
  typecheck_commands:
    []
  format: ""
  format_commands:
    []
