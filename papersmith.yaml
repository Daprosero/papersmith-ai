paper_ingestion:
  engine: marker
  # Conversion mode:
  #   fast     -> lightweight layout/table detectors, OCR only garbled/empty blocks (recommended on CPU/MPS)
  #   balanced -> VLM layout model + full-page OCR (highest fidelity, best on GPU, slow on Mac)
  mode: fast
  # true -> drop the references/bibliography section at the end of each paper (no
  # information value, and it inflates token cost).
  strip_references: true
  # Each source root holds loose PDFs. Ingestion moves each PDF into its own
  # <stem>/ folder alongside its .md and figure images. A loose PDF = not yet
  # ingested; a PDF already inside its folder is skipped.
  #
  # Source roots are rediscovered on every run: every folder directly under
  # source_base that holds at least one loose PDF is one. Drop a new folder in
  # with its PDFs and it is picked up — no edit here. A folder with no loose PDF
  # is left alone, because ingestion moves files and only a PDF you put there
  # says you meant it.
  source_base: guidance
  # Optional: extra roots outside source_base, listed explicitly.
  source_roots: []
