paper_ingestion:
  engine: marker
  # Conversion mode:
  #   fast     -> lightweight layout/table detectors, OCR only garbled/empty blocks (recommended on CPU/MPS)
  #   balanced -> VLM layout model + full-page OCR (highest fidelity, best on GPU, slow on Mac)
  mode: fast
  # true -> drop the references/bibliography section at the end of each paper (no
  # information value, and it inflates token cost).
  strip_references: true
  # Each source root holds loose PDFs. Ingestion moves each PDF into its own
  # <stem>/ folder alongside its .md and figure images. A loose PDF = not yet
  # ingested; a PDF already inside its folder is skipped.
  #
  # Source roots are rediscovered on every run: every folder directly under
  # source_base that holds at least one loose PDF is one. Drop a new folder in
  # with its PDFs and it is picked up — no edit here. A folder with no loose PDF
  # is left alone, because ingestion moves files and only a PDF you put there
  # says you meant it.
  source_base: guidance
  # Optional: extra roots outside source_base, listed explicitly.
  source_roots: []

# paper-writing's connector roles (no-claim-without-a-source-that-holds-it).
# A role names WHAT a connector is used for, never WHICH connector -- adding,
# removing or replacing a connector is a config edit here, never a code edit
# (literature-search, Requirement: Connector Roles Are Configuration, Never
# Code). `discovery` runs through the agent's own MCP servers (see
# `.mcp.json`) and is never read by the CLI; `resolution` and `full-text`
# are read by `paper_resolve.py` over stdlib `urllib`, keyless.
paper_writing:
  # A courtesy contact for OpenAlex's polite pool (their own `mailto`
  # convention) -- never a secret, never sent to any connector when left
  # empty. Each operator fills in their own; nothing here is a shared
  # credential.
  contact: ""
  roles:
    discovery: []
    resolution:
      - openalex
      - crossref
      - arxiv
    # Only the two connectors that can ever name a real, fetchable PDF from
    # their own resolved metadata (`paper_resolve._parse_openalex`/
    # `_parse_arxiv`'s own `full_text_url`). Crossref is deliberately never
    # listed here: a bare Crossref DOI usually leads to a publisher wall,
    # and this skill never guesses a "probably open" link -- reachability
    # is measured from the cached metadata alone, never assumed
    # (`the-pdf-arrives-or-the-operator-is-told`).
    full-text:
      - openalex
      - arxiv
