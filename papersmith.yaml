paper_ingestion:
  model_profile: paper-ingestion
  page_render_dpi: 200
  confidence_threshold: 0.85
  source_roots:
    - guidance/paper-guide/source
    - guidance/reference-papers/source
  extract:
    text: true
    figures: true
    # Lite evidence only: retain exact raw page text and rendered pages; never infer table structure.
    tables: true
    equations: true
